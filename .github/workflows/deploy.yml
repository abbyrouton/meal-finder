name: Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Build Go binary
        run: |
          cd backend
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o server main.go

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          # Stop service before copying
          ssh -i ~/.ssh/deploy_key "${SSH_USERNAME}@${SSH_HOST}" \
            "sudo systemctl stop meal-finder-api || true"

          # Create backend directory on server
          ssh -i ~/.ssh/deploy_key "${SSH_USERNAME}@${SSH_HOST}" \
            "mkdir -p ~/meal-finder-backend"

          # Copy binary
          scp -i ~/.ssh/deploy_key backend/server \
            "${SSH_USERNAME}@${SSH_HOST}:~/meal-finder-backend/server"

          # Copy migrations (for reference)
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            backend/db/migrations/ \
            "${SSH_USERNAME}@${SSH_HOST}:~/meal-finder-backend/migrations/"

      - name: Restart backend
        run: |
          ssh -i ~/.ssh/deploy_key "${SSH_USERNAME}@${SSH_HOST}" << 'EOF'
            cd ~/meal-finder-backend
            chmod +x server
            sudo systemctl start meal-finder-api
          EOF

  deploy-frontend:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build
        run: cd frontend && npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" \
            frontend/.next/standalone/ \
            "${SSH_USERNAME}@${SSH_HOST}:~/meal-finder-standalone/"

          ssh -i ~/.ssh/deploy_key "${SSH_USERNAME}@${SSH_HOST}" \
            "mkdir -p ~/meal-finder-standalone/.next/static"

          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            frontend/.next/static/ \
            "${SSH_USERNAME}@${SSH_HOST}:~/meal-finder-standalone/.next/static/"

          rsync -avz -e "ssh -i ~/.ssh/deploy_key" \
            frontend/public/ \
            "${SSH_USERNAME}@${SSH_HOST}:~/meal-finder-standalone/public/"

          # Create symlink so server.js can find static files
          ssh -i ~/.ssh/deploy_key "${SSH_USERNAME}@${SSH_HOST}" \
            "ln -sf ~/meal-finder-standalone/.next/static ~/meal-finder-standalone/frontend/.next/static"

      - name: Restart frontend
        run: |
          ssh -i ~/.ssh/deploy_key "${SSH_USERNAME}@${SSH_HOST}" \
            "sudo systemctl restart meal-finder-frontend"
